  codename: AIOS

  description: >
    A Linux system for ethical hacking on the inside, a Windows-style
    desktop on the outside, with AI as a first-class S-rank kernel
    subsystem that controls the whole system. Three pillars — Pillar A
    (Linux ethical-hacking platform), Pillar B (Windows-style desktop),
    Pillar C (AI as S-rank first-class kernel subsystem) — drive all
    product decisions.

