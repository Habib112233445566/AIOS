[project]
name = "aiosh-mcp"
version = "0.1.0"
description = "AIOS MCP server — exposes the AIOS subsystem surface over Model Context Protocol (ADR-0035 §D-2 binding)."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "fastmcp>=0.4.0",
    "mcp>=1.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aiosh_mcp*"]
