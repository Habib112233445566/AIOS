[workspace]
resolver = "2"
members = [
    "aiosh-core",
    "aiosh-cli",
    "aiosh-mcp",
    "aiosh-sandbox",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "TBD"
repository = "https://github.com/aios/aios"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
ureq = { version = "2", features = ["json"] }
ipnet = "2"

[profile.release]
lto = true
